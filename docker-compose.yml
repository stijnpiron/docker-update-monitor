name: docker-update-monitor
services:
  docker-update-monitor:
    image: ghcr.io/stijnpiron/docker-update-monitor:latest
    container_name: docker-update-monitor
    restart: unless-stopped

    environment:
      # Notification channels: comma-separated list of "webhook", "email"
      # Default: webhook (backward compatible)
      NOTIFY_CHANNELS: "${NOTIFY_CHANNELS:-webhook}"

      # --- Webhook channel ---
      # Required (if using webhook): where to POST update payloads
      NOTIFY_ENDPOINT: "${NOTIFY_ENDPOINT}"

      # Docker Hub credentials (strongly recommended to avoid anonymous rate limits).
      # Preferred: use a Personal Access Token (PAT) as the password.
      # Generate one at: https://app.docker.com/settings/personal-access-tokens
      DOCKERHUB_USERNAME: "${DOCKERHUB_USERNAME}"
      DOCKERHUB_PASSWORD: "${DOCKERHUB_PASSWORD}" # password or PAT

      # GitHub PAT with read:packages scope — required for ghcr.io images.
      # Generate one at: https://github.com/settings/tokens
      GITHUB_TOKEN: "${GITHUB_TOKEN}"

      # --- Email channel (SMTP) ---
      # Required (if using email): SMTP_HOST, SMTP_FROM, SMTP_TO
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_TO: "${SMTP_TO}"
      SMTP_TLS: "${SMTP_TLS:-true}"

      # Cron schedule for checks (default: every hour on the hour)
      # Standard 5-field cron: minute hour day month weekday
      # Examples:
      #   "0 * * * *"    — every hour
      #   "0 */6 * * *"  — every 6 hours
      #   "0 8 * * *"    — daily at 08:00
      #   "0 3 * * 7"    — every Sunday at 03:00
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 3 * * 7}"

      # Set to "true" to log updates without POSTing — useful for testing
      DRY_RUN: "false"

      # Cooldown period before notifying about a newly detected update.
      # Accepted formats: "0" (no cooldown, default), "12h", "3d", "2w", "1m".
      # Can be overridden per container with the docker-update-monitor.update-cooldown label.
      # UPDATE_COOLDOWN: "0"

      # Label namespace (default: docker-update-monitor)
      # LABEL_PREFIX: "docker-update-monitor"
      # Containers are monitored when they carry at least one of these labels:
      #   docker-update-monitor.tag-regex  — semver detection (and implicit digest fallback
      #                                      when the current tag does not match the regex)
      #   docker-update-monitor.mode=digest — explicit digest mode: compares the running
      #                                       image's RepoDigests against the registry on
      #                                       every scan; works from the first scan without
      #                                       a silent warm-up. Can be combined with
      #                                       tag-regex to resolve the new digest to a
      #                                       versioned tag.

      # Log verbosity: DEBUG | INFO | WARNING | ERROR
      LOG_LEVEL: "INFO"

      # Dashboard datetime display format (Python strftime)
      # Examples: "%d/%m/%Y %H:%M", "%Y-%m-%d %H:%M:%S", "%b %d, %Y %I:%M %p"
      DASHBOARD_DATETIME_FORMAT: "${DASHBOARD_DATETIME_FORMAT:-%d/%m/%Y %H:%M}"

      # --- Multi-host scanning over SSH (optional) ---
      # Scan one or more remote Docker daemons in addition to the local one, all
      # on the single CRON_SCHEDULE above, from this one instance. Leave DOCKER_HOSTS
      # unset (the default) to keep scanning only the local socket — behavior is
      # unchanged and no SSH connection is attempted.
      #
      # Format: comma-separated "name=ssh://user@host" pairs. The name is the
      # stable per-host label shown in the dashboard and notifications and must
      # match a `Host <alias>` block in the shared OpenSSH config mounted below
      # (see the volumes/secrets notes). `local` is reserved for the local daemon.
      # No HOME override is needed: the image sets user `nobody`'s home directory
      # to /home/ssh so the OpenSSH client finds /home/ssh/.ssh/config by default.
      #
      # Example:
      #
      #   DOCKER_HOSTS: "${DOCKER_HOSTS:-prod=ssh://monitor@prod-host,nas=ssh://monitor@nas-host}"
      #   HOST_REACH_COOLDOWN: "${HOST_REACH_COOLDOWN}"   # re-alert window for a host down/recovered, e.g. "30m", "1h", "2d" (default "1h")

    ports:
      # Expose the web dashboard and /metrics endpoint
      - "8080:8080"

    volumes:
      # Read-only access to the Docker socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent state database
      - ./data:/app/data

      # --- Multi-host SSH config (optional; enable when DOCKER_HOSTS is set) ---
      # Mount the shared, read-only OpenSSH client config. The image sets user
      # `nobody`'s **passwd** home directory to /home/ssh (via `usermod -d`), so
      # the ssh client (invoked by DockerClient(use_ssh_client=True) with no -F
      # flag) reads /home/ssh/.ssh/config by default — no HOME env override is
      # needed. Each `Host <alias>` block maps its host to a per-host key (a
      # /run/secrets/ path, see the secrets below). The mounted directory and
      # the config file must be readable by the container user `nobody`. Note
      # the mount is read-only, so `accept-new` host-key entries cannot
      # persist: every connection to a host whose key is not recorded
      # prints "Failed to add the host to the list of known hosts" and
      # continues — the key is never recorded and never verified. For real
      # host-key pinning, mount a writable `known_hosts` file separately
      # (without `:ro`) and point `UserKnownHostsFile` in the config at it
      # (e.g.
      # `- ./config/ssh/known_hosts:/home/ssh/known_hosts`): with
      # `accept-new`, first contact records the key (a one-time warning),
      # later connects are silent, and a host that changes its key thereafter
      # fails the connection hard with "Host key verification failed" and is
      # recorded unreachable. Do not use `UserKnownHostsFile /dev/null` to
      # "suppress" the warning — writes to /dev/null always succeed, so ssh
      # prints "Permanently added …" on **every** connect instead, while
      # recording nothing.
      # Example ./config/ssh/.ssh/config:
      #
      #   Host prod-host
      #       IdentityFile /run/secrets/ssh_prod_key
      #       StrictHostKeyChecking accept-new
      #
      #   Host nas-host
      #       IdentityFile /run/secrets/ssh_nas_key
      #       StrictHostKeyChecking accept-new
      #
      # - ./config/ssh/.ssh:/home/ssh/.ssh:ro

    # Needed so 'nobody' user can access the Docker socket
    group_add:
      - "${DOCKER_GID:-999}"

    # --- Multi-host SSH keys (optional; enable when DOCKER_HOSTS is set) ---
    # One read-only secret per remote host, referenced by the Host blocks in the
    # mounted config. Each secret is mounted at /run/secrets/<name>. Using a key
    # per host limits blast radius if one host/key is compromised. The source
    # private-key files MUST be readable by `nobody` (chmod 644) or the scan
    # fails with an auth/permission error and the host is marked unreachable —
    # a clear, fixable failure, not a silent no-op.
    #
    # secrets:
    #   - ssh_prod_key
    #   - ssh_nas_key

    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# --- Multi-host SSH keys (optional; top-level `secrets`) ---
# Define each per-host private key here and enable it in the service `secrets:`
# list above. Each entry maps a file on the Docker host to a read-only
# /run/secrets/<name> in the container. Source files must be `chmod 644` so the
# `nobody` user can read them.
#
# secrets:
#   ssh_prod_key:
#     file: ./config/ssh/ssh_prod_key   # private key for prod-host  (chmod 644)
#   ssh_nas_key:
#     file: ./config/ssh/ssh_nas_key    # private key for nas-host   (chmod 644)
